name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: bizflow
          POSTGRES_USER: bizflow
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bizflow -d bizflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r backend/requirements.txt pip-audit
      - name: Compile check
        run: python -m compileall -q backend/app backend/tests backend/alembic
      - name: Dependency security audit
        working-directory: backend
        run: pip-audit -r requirements.txt
        continue-on-error: true
      - name: Migration upgrade / downgrade / upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bizflow:ci-password@localhost:5432/bizflow
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Backend tests
        working-directory: backend
        env:
          USE_SQLITE: "true"
          JWT_SECRET: "ci-only-secret-at-least-32-characters-long"
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        working-directory: frontend
        run: npm test -- --run
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Dependency security audit
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Production build
        working-directory: frontend
        run: npm run build

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Contract tests
        working-directory: contracts/escrow
        run: cargo test
      - name: Clippy
        working-directory: contracts/escrow
        run: cargo clippy -- -D warnings
        continue-on-error: true
