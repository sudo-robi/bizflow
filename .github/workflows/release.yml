name: Release

# Actions stay on mutable major version tags for parity with CI. Full SHA
# pinning is a documented residual hardening item (docs/DEPLOYMENT.md).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  # This job mirrors the blocking checks in ci.yml. A release must not publish
  # images if lint, audits, migrations, tests or Docker builds would fail CI.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_DB: bizflow
          POSTGRES_USER: bizflow
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bizflow -d bizflow"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32v1-none
      - name: Install backend dependencies and CI tooling
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install "pip-audit>=2.7,<3" "ruff==0.17.6"
      - name: Compile check
        run: python -m compileall -q backend/app backend/tests backend/alembic
      - name: Backend lint (correctness gate)
        run: ruff check --isolated --select E9,F63,F7,F82 backend/app backend/tests
      - name: Dependency security audit (blocking)
        working-directory: backend
        run: pip-audit --strict -r requirements.txt
      - name: Migration validation (upgrade / downgrade / upgrade)
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg2://bizflow:ci-password@localhost:5432/bizflow
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          ENVIRONMENT: test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Backend tests
        working-directory: backend
        env:
          USE_SQLITE: "true"
          JWT_SECRET: "ci-only-secret-at-least-32-characters-long"
        run: python -m pytest -q
      - name: Frontend install, lint, tests, typecheck, audit and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test -- --run
          npm run lint
          npm run typecheck
          npm audit --audit-level=high
          npm run build
      - name: Contract tests
        working-directory: contracts/escrow
        run: cargo test
      - name: Clippy (blocking)
        working-directory: contracts/escrow
        run: cargo clippy -- -D warnings -A clippy::too_many_arguments -A clippy::needless_borrows_for_generic_args
      - name: Soroban WASM build
        working-directory: contracts/escrow
        env:
          STELLAR_CLI_VERSION: "30.0.0"
        run: cargo build --target wasm32v1-none --release
      - name: Verify backend image builds
        run: docker build -f backend/Dockerfile backend -t bizflow-backend:verify
      - name: Verify frontend image builds
        run: |
          docker build -f frontend/Dockerfile frontend \
            --build-arg NEXT_PUBLIC_API_BASE_URL=/api/v1 \
            --build-arg BACKEND_ORIGIN=http://backend:8000 \
            -t bizflow-frontend:verify

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizflow-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bizflow-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            BACKEND_ORIGIN=http://backend:8000
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizflow-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bizflow-frontend:latest

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/bizflow-backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/bizflow-frontend:${{ github.ref_name }}`
