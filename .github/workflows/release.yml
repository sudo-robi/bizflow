name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        env:
          USE_SQLITE: "true"
          JWT_SECRET: "ci-only-secret-at-least-32-characters-long"
        run: python -m pytest -q
      - name: Frontend install and tests
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm test -- --run && npm run typecheck && npm run build
      - name: Contract tests
        working-directory: contracts/escrow
        run: cargo test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizflow-backend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bizflow-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=/api/v1
            BACKEND_ORIGIN=http://backend:8000
          tags: |
            ghcr.io/${{ github.repository_owner }}/bizflow-frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bizflow-frontend:latest

      - name: Publish release notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Container images:
            - `ghcr.io/${{ github.repository_owner }}/bizflow-backend:${{ github.ref_name }}`
            - `ghcr.io/${{ github.repository_owner }}/bizflow-frontend:${{ github.ref_name }}`
